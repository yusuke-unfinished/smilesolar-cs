name: Deploy to お名前.com RS (FTP)

# main ブランチへ push されるたびに、お名前.com RS サーバーへ FTP アップロードします。
# 公開URL想定: https://unfinished-llc.com/smilesolar-cs/

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # GitHubの画面から手動実行も可能

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: FTP アップロード
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # --- 接続情報（GitHubの Settings > Secrets and variables > Actions で登録）---
          server: ${{ secrets.FTP_SERVER }}       # 例: ftp.onamae.ne.jp などRSのFTPホスト
          username: ${{ secrets.FTP_USERNAME }}    # RSのFTPユーザー名
          password: ${{ secrets.FTP_PASSWORD }}    # RSのFTPパスワード
          port: 21
          protocol: ftp                            # SFTPしか使えない場合は別方式が必要（下記README参照）

          # --- アップロード元 / 先 ---
          local-dir: ./                            # リポジトリ直下（index.html）
          # ↓ サーバー上の公開ディレクトリ。unfinished-llc.com/smilesolar-cs/ に出す想定。
          #    実際のパスはRSの構成に依存するため、Secret で指定します（末尾スラッシュ必須）。
          server-dir: ${{ secrets.FTP_SERVER_DIR }}  # 例: /public_html/smilesolar-cs/

          # --- アップロードしないもの（フォーム以外はサーバーに置かない）---
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            .gitignore
